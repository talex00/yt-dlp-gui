name: Build and release Windows app

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "app.py"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build application
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name yt-dlp-gui --collect-all customtkinter app.py

      - name: Add yt-dlp and FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "dist/yt-dlp.exe"
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "ffmpeg.zip"
          Expand-Archive "ffmpeg.zip" "ffmpeg"
          $bin = Get-ChildItem "ffmpeg" -Directory | Select-Object -First 1
          Copy-Item "$($bin.FullName)/bin/ffmpeg.exe" "dist/ffmpeg.exe"
          Copy-Item "$($bin.FullName)/bin/ffprobe.exe" "dist/ffprobe.exe"
          Compress-Archive -Path "dist/*" -DestinationPath "yt-dlp-gui-windows.zip"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          gh release create $tag "yt-dlp-gui-windows.zip" `
            --target "${{ github.sha }}" `
            --title "yt-dlp GUI — build ${{ github.run_number }}" `
            --notes "Готовая portable-сборка для Windows. Распакуйте архив и запустите yt-dlp-gui.exe. Python не требуется." `
            --latest
