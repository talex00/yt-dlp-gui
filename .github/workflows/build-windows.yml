name: Build and release Windows app

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "app.py"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter pyinstaller

      - name: Download embedded yt-dlp and FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "embedded" -Force | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "embedded/yt-dlp.exe"
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "ffmpeg.zip"
          Expand-Archive "ffmpeg.zip" "ffmpeg"
          $bin = Get-ChildItem "ffmpeg" -Directory | Select-Object -First 1
          Copy-Item "$($bin.FullName)/bin/ffmpeg.exe" "embedded/ffmpeg.exe"

      - name: Create runtime hook
        shell: pwsh
        run: |
          @'
          import os
          import sys

          bundle_dir = getattr(sys, "_MEIPASS", "")
          if bundle_dir:
              os.environ["PATH"] = bundle_dir + os.pathsep + os.environ.get("PATH", "")
          '@ | Set-Content -Path "embedded_tools_path.py" -Encoding UTF8

      - name: Build single portable EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name yt-dlp-gui `
            --collect-all customtkinter `
            --runtime-hook "embedded_tools_path.py" `
            --add-binary "embedded/yt-dlp.exe;." `
            --add-binary "embedded/ffmpeg.exe;." `
            app.py
          $size = [math]::Round((Get-Item "dist/yt-dlp-gui.exe").Length / 1MB, 1)
          "Single EXE size: $size MB" | Write-Host

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          gh release create $tag "dist/yt-dlp-gui.exe#yt-dlp-gui.exe" `
            --target "${{ github.sha }}" `
            --title "yt-dlp GUI — build ${{ github.run_number }}" `
            --notes "Один готовый EXE для Windows. yt-dlp и FFmpeg уже встроены внутрь; Python, распаковка и дополнительные файлы не требуются." `
            --latest
