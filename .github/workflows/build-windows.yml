name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build GUI executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name yt-dlp-gui --collect-all customtkinter app.py

      - name: Download yt-dlp
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "dist/yt-dlp.exe"

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-package"
          $bin = Get-ChildItem -Path "ffmpeg-package" -Directory | Select-Object -First 1
          Copy-Item "$($bin.FullName)/bin/ffmpeg.exe" "dist/ffmpeg.exe"
          Copy-Item "$($bin.FullName)/bin/ffprobe.exe" "dist/ffprobe.exe"

      - name: Add package information
        shell: pwsh
        run: |
          @"
          yt-dlp GUI — portable build

          Запустите yt-dlp-gui.exe. Установка Python не требуется.
          Не удаляйте yt-dlp.exe, ffmpeg.exe и ffprobe.exe из этой папки.
          "@ | Set-Content -Path "dist/README.txt" -Encoding UTF8

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-gui-windows-portable
          path: dist/
          if-no-files-found: error
          retention-days: 30
