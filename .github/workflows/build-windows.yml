name: Build and release Windows app

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "app.py"
      - "dpi_physical_screen.py"
      - "README.md"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

env:
  # "lgpl"        - один статический ffmpeg.exe, сборка заметно меньше
  # "lgpl-shared" - ffmpeg.exe + набор av*.dll, проще с требованием LGPL о перелинковке
  # Переключается одной строкой, остальной пайплайн менять не надо.
  FFMPEG_VARIANT: lgpl

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter pyinstaller

      - name: Download yt-dlp and its legal files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "embedded" -Force | Out-Null
          New-Item -ItemType Directory -Path "legal" -Force | Out-Null

          $release = Invoke-RestMethod "https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest"
          $tag = $release.tag_name
          "YT_DLP_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # берём бинарник строго того же тега, что и тексты лицензий
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/$tag/yt-dlp.exe" `
            -OutFile "embedded/yt-dlp.exe"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/yt-dlp/yt-dlp/$tag/LICENSE" `
            -OutFile "legal/YT-DLP-LICENSE.txt"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/yt-dlp/yt-dlp/$tag/THIRD_PARTY_LICENSES.txt" `
            -OutFile "legal/YT-DLP-THIRD-PARTY-LICENSES.txt"

      - name: Download LGPL FFmpeg build
        shell: pwsh
        run: |
          $archive = "ffmpeg-master-latest-win64-$env:FFMPEG_VARIANT.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$archive" `
            -OutFile "ffmpeg-lgpl.zip"
          Expand-Archive "ffmpeg-lgpl.zip" "ffmpeg-lgpl"
          $root = Get-ChildItem "ffmpeg-lgpl" -Directory | Select-Object -First 1
          Copy-Item "$($root.FullName)/bin/ffmpeg.exe" "embedded/ffmpeg.exe"

          # у shared-сборки рядом с ffmpeg.exe лежат av*.dll, у статической их нет
          $dlls = @(Get-ChildItem "$($root.FullName)/bin" -Filter "*.dll" -ErrorAction SilentlyContinue)
          if ($dlls.Count -gt 0) {
            $dlls | Copy-Item -Destination "embedded"
          }

          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/FFmpeg/FFmpeg/master/LICENSE.md" `
            -OutFile "legal/FFMPEG-LICENSE.md"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/FFmpeg/FFmpeg/master/COPYING.LGPLv2.1" `
            -OutFile "legal/COPYING.LGPLv2.1.txt"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/FFmpeg/FFmpeg/master/COPYING.LGPLv3" `
            -OutFile "legal/COPYING.LGPLv3.txt"

          # точный коммит сборки нужен, чтобы сослаться на соответствующий исходник
          $versionLine = (& "embedded/ffmpeg.exe" -version | Select-Object -First 1)
          if ($versionLine -match 'g([0-9a-f]{7,40})') {
            $commit = $Matches[1]
          } else {
            $commit = "master"
          }
          "FFMPEG_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create third-party notice
        shell: pwsh
        run: |
          $ffmpegSource = if ($env:FFMPEG_COMMIT -eq "master") {
            "https://github.com/FFmpeg/FFmpeg/archive/refs/heads/master.zip"
          } else {
            "https://github.com/FFmpeg/FFmpeg/archive/$env:FFMPEG_COMMIT.zip"
          }

          @"
          THIRD-PARTY SOFTWARE NOTICES

          This product invokes the following independent command-line programs:

          1. yt-dlp ($env:YT_DLP_TAG)
             Project: https://github.com/yt-dlp/yt-dlp
             License: Unlicense; bundled dependencies use their own licenses.
             Full notices: YT-DLP-THIRD-PARTY-LICENSES.txt
             Corresponding source:
             https://github.com/yt-dlp/yt-dlp/archive/refs/tags/$env:YT_DLP_TAG.zip

          2. FFmpeg (git commit $env:FFMPEG_COMMIT)
             Project: https://ffmpeg.org
             Binary provider: https://github.com/BtbN/FFmpeg-Builds
             Build type: win64 $env:FFMPEG_VARIANT
             License: LGPL v2.1 or later; see FFMPEG-LICENSE.md, COPYING.LGPLv2.1.txt
             and COPYING.LGPLv3.txt.
             Corresponding source:
             $ffmpegSource

          The GUI launches yt-dlp and FFmpeg as separate subprocesses and does not
          link against their libraries.

          WRITTEN OFFER

          For at least three years from the date of this release, the maintainer of
          this project will provide, on request filed through the project issue
          tracker at https://github.com/talex00/yt-dlp-gui/issues, the complete
          corresponding machine-readable source code for the FFmpeg build
          distributed with this product, on a medium customarily used for software
          interchange, at no charge beyond the cost of distribution.

          FFmpeg and yt-dlp are not affiliated with or endorsed by this project.
          "@ | Set-Content -Path "legal/THIRD-PARTY-NOTICES.txt" -Encoding UTF8

      - name: Create runtime hook
        shell: pwsh
        run: |
          @'
          import os
          import sys

          bundle_dir = getattr(sys, "_MEIPASS", "")
          if bundle_dir:
              os.environ["PATH"] = bundle_dir + os.pathsep + os.environ.get("PATH", "")
          '@ | Set-Content -Path "embedded_tools_path.py" -Encoding UTF8

      - name: Build single portable EXE
        shell: pwsh
        run: |
          $binaryArgs = @()
          Get-ChildItem "embedded" -File | ForEach-Object {
            $binaryArgs += "--add-binary"
            $binaryArgs += "$($_.FullName);."
          }

          # в legal лежат только текстовые уведомления (~270 КБ), архивов исходников больше нет
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name yt-dlp-gui `
            --collect-all customtkinter `
            --runtime-hook "embedded_tools_path.py" `
            --runtime-hook "dpi_physical_screen.py" `
            --add-data "legal;licenses" `
            @binaryArgs `
            app.py

          $size = [math]::Round((Get-Item "dist/yt-dlp-gui.exe").Length / 1MB, 1)
          "Single EXE size: $size MB" | Write-Host

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          $assets = @(
            "dist/yt-dlp-gui.exe#yt-dlp-gui.exe",
            "legal/THIRD-PARTY-NOTICES.txt",
            "legal/YT-DLP-LICENSE.txt",
            "legal/YT-DLP-THIRD-PARTY-LICENSES.txt",
            "legal/FFMPEG-LICENSE.md",
            "legal/COPYING.LGPLv2.1.txt",
            "legal/COPYING.LGPLv3.txt"
          )

          $notes = @"
          Один готовый EXE для Windows. Внутри находятся официальный yt-dlp ($env:YT_DLP_TAG) и LGPL-сборка FFmpeg (коммит $env:FFMPEG_COMMIT).

          Тексты лицензий приложены к релизу и лежат внутри EXE в папке licenses. Ссылки на соответствующие исходники и written offer — в THIRD-PARTY-NOTICES.txt.
          "@

          gh release create $tag @assets `
            --target "${{ github.sha }}" `
            --title "yt-dlp GUI — build ${{ github.run_number }}" `
            --notes $notes `
            --latest
