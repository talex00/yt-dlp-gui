name: Build and release Windows app

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "app.py"
      - "dpi_physical_screen.py"
      - "README.md"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter pyinstaller

      - name: Build single portable EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name yt-dlp-gui `
            --collect-all customtkinter `
            --runtime-hook "dpi_physical_screen.py" `
            app.py

          $size = [math]::Round((Get-Item "dist/yt-dlp-gui.exe").Length / 1MB, 1)
          "Single EXE size: $size MB" | Write-Host
          if ($size -gt 60) {
            Write-Output "::warning::EXE is $size MB — expected under 60 MB without bundled yt-dlp/ffmpeg"
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          gh release create $tag dist/yt-dlp-gui.exe `
            --target "${{ github.sha }}" `
            --title "yt-dlp GUI — build ${{ github.run_number }}" `
            --notes "One portable EXE for Windows. yt-dlp and FFmpeg are downloaded automatically on first launch into a tools folder next to the executable." `
            --latest
